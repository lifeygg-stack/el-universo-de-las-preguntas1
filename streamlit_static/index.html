ión de la sensibilidad de nuestros ojos, el espectro solar y otros factores hace que percibamos el cielo despejado principalmente azul.",deep:"En la dispersión de Rayleigh, las longitudes de onda más cortas se desvían con mayor eficacia. Sin embargo, el Sol emite menos radiación violeta que azul y nuestros fotorreceptores (conos S, M y L) responden con mayor sensibilidad al rango azul-verde."}),l.jsx(ur,{index:"02",tag:"Termodinámica",q:"¿Por qué una cuchara metálica parece más fría que una de madera en la misma habitación?",a:"El metal conduce el calor mucho más rápidamente. Cuando lo tocamos, extrae energía térmica de nuestra mano más deprisa que la madera, por lo que suele parecernos más frío aunque ambos objetos tengan una temperatura similar.",deep:"Nuestra piel no funciona como un termómetro directo de la temperatura del objeto, sino como un detector del flujo de energía térmica (conductividad térmica). Como el metal disipa rápidamente el calor de nuestros dedos, los termorreceptores cutáneos registran un enfriamiento veloz."}),l.jsx(ur,{index:"03",tag:"Ondas y Propagación",q:"¿Por qué vemos primero el relámpago y después escuchamos el trueno?",a:"La luz viaja muchísimo más rápido que el sonido en el aire. Por eso la señal luminosa llega antes a nuestros ojos que el sonido a nuestros oídos.",deep:"Mientras la luz se propaga a casi 300 000 km/s en el aire, la onda acústica del trueno avanza a unos 343 m/s (a 20 °C). Contar los segundos de diferencia y dividir entre 3 permite estimar a cuántos kilómetros ocurrió la descarga."}),l.jsx(ur,{index:"04",tag:"Estructura de la Materia",q:"¿Por qué el hielo flota en el agua?",a:"En condiciones habituales, el hielo tiene menor densidad que el agua líquida debido a la estructura que forman sus moléculas al congelarse.",deep:"Los puentes de hidrógeno entre las moléculas de H₂O forman una red cristalina hexagonal abierta al solidificarse, dejando más espacio vacío entre moléculas que en el estado líquido. Por el principio d
